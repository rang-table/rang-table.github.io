<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#72518c"><title>高雄 Rang 阿米吃桌｜桌次查詢</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3f9;color:#392e44;font-family:system-ui,"Microsoft JhengHei",sans-serif}header{padding:24px 7%;border-bottom:1px solid #e5dcec;display:flex;justify-content:space-between;color:#79628d;font-size:13px;letter-spacing:2px}header b{font-size:18px}main{max-width:1000px;margin:70px auto;padding:0 24px;display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.eyebrow{font-size:11px;letter-spacing:3px;color:#9877ad}h1{font-size:44px;line-height:1.5;margin:18px 0}em{font-style:normal;color:#805b9c}p{color:#8a7a96;line-height:1.9;font-size:14px}.art{margin:45px auto 20px;width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:#e8dfee;border:1px solid #d0bfdc;box-shadow:0 0 0 14px #eee7f4,0 0 0 15px #dacde5;color:#9976b1;font-size:30px;font-family:serif;transform:rotate(-10deg)}.caption{text-align:center;font-size:11px;letter-spacing:3px;color:#a490b2}.card{padding:34px;background:white;border:1px solid #e7deef;border-radius:22px;box-shadow:0 14px 60px #50336108}h2{font-size:24px;margin:12px 0}label{display:block;font-size:14px;font-weight:650;margin:23px 0 9px}input{width:100%;font:inherit;padding:15px;border:1px solid #ddd3e5;border-radius:9px;background:#fefcff}input:focus{outline:3px solid #e8dcef;border-color:#9471ac}input::placeholder{color:#b5a8be}button{width:100%;padding:16px;border:0;border-radius:9px;background:#72518c;color:white;font:inherit;font-weight:650;cursor:pointer;margin-top:25px}button:hover{background:#5c3d75}button:disabled{opacity:.6}.hint,.note{font-size:12px}.note{text-align:center}.demo{padding:12px;background:#f1eaf7;border-radius:8px;color:#856b97;font-size:12px;line-height:1.9;margin-top:20px}.error{color:#a13d62;font-size:14px}.result{text-align:center}.number{font-size:84px;color:#795392;font-weight:650}.leader{background:#f6f1f9;border-radius:12px;padding:18px;margin:15px 0}.leader small{display:block;color:#94809f;margin-bottom:8px}.leader strong{font-size:24px}footer{text-align:center;padding:25px;border-top:1px solid #e5dcec;color:#a08eac;font-size:12px;line-height:2}[hidden]{display:none!important}@media(max-width:700px){header{padding:20px}header span{font-size:10px}main{display:block;max-width:480px;margin:32px auto;padding:0 22px}h1{font-size:34px}.art,.caption{display:none}.card{margin-top:28px;padding:25px}}</style><link rel="stylesheet" href="mobile.css"><header><b>✦ 阿米，入席囉</b><span>KAOHSIUNG · ARMY</span></header><main><section><div class="eyebrow">A TABLE FULL OF PURPLE HEARTS</div><h1>高雄 Rang 阿米<br><em>吃桌</em></h1><p>因為 BTS 相聚，為彼此留一個位子。<br>歡迎來吃桌，先來找找你的桌次吧！</p><div class="art" aria-hidden="true">相聚</div><p class="caption">一起吃飯，一起留下紫色的回憶。</p></section><section class="card"><div id="lookup"><div class="eyebrow">WELCOME, ARMY</div><h2>找找你的位子</h2><p>填寫報名資料，即可查詢桌號與桌長。</p><form id="form"><label for="name">報名時的本名</label><input id="name" name="name" placeholder="請輸入報名時填寫的本名" maxlength="80" autocomplete="name" required><label for="digits">轉帳帳號後五碼</label><input id="digits" name="digits" type="text" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="例如 01234" autocomplete="off" required aria-describedby="hint"><p class="hint" id="hint">請填寫報名時登記的轉出帳號後五碼。</p><p class="error" id="error" role="alert" hidden></p><button id="submit">查詢我的桌次　→</button></form><p class="note">查不到資料？請向現場報到工作人員詢問。</p></div><div id="result" class="result" tabindex="-1" hidden><div style="font-size:32px;color:#9872af">♡</div><h2><span id="guest"></span>，歡迎來吃桌！</h2><p>你的位子在這裡</p><div class="number"><span id="table"></span><small style="font-size:20px"> 桌</small></div><div class="leader"><small>這一桌的桌長</small><strong id="leader"></strong></div><p>請依現場桌牌入座，桌長會協助你。</p><button id="reset" type="button">查詢其他人</button></div></section></main><footer>高雄 Rang 阿米吃桌<br>BTS 粉絲自發活動 · 非官方主辦</footer><script src="config.js"></script><script>const form=document.querySelector('#form'),error=document.querySelector('#error'),button=document.querySelector('#submit');form.addEventListener('submit',async e=>{e.preventDefault();error.hidden=true;if(!window.APP_CONFIG.apiBaseUrl){error.textContent='查詢尚未開放，請洽主辦單位。';error.hidden=false;return;}button.disabled=true;button.textContent='正在查詢…';try{const response=await fetch(window.APP_CONFIG.apiBaseUrl+'/api/lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:form.elements.name.value,digits:form.elements.digits.value})});const data=await response.json();if(!response.ok)throw Error(data.error||'查詢暫時無法使用。');for(const key of ['guest','table','leader'])document.getElementById(key).textContent=data[key==='guest'?'name':key];document.querySelector('#lookup').hidden=true;document.querySelector('#result').hidden=false;document.querySelector('#result').focus();}catch(e){error.textContent=e.message||'連線失敗，請稍後再試。';error.hidden=false;}finally{button.disabled=false;button.textContent='查詢我的桌次　→';}});document.querySelector('#reset').onclick=()=>{form.reset();document.querySelector('#result').hidden=true;document.querySelector('#lookup').hidden=false;document.querySelector('#name').focus();};</script></html>
